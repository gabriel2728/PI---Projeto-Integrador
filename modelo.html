<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuperar senha — MeuApp</title>
</head>
<body>
  <main>
    <h1>Recuperar sua senha</h1>
    <p>Informe o e-mail associado à sua conta. Enviaremos uma senha temporária por e-mail.</p>

    <form id="recuperar-form" action="/recuperar-senha" method="POST">
      <label for="email">E-mail</label><br/>
      <input id="email" name="email" type="email" placeholder="seu@exemplo.com" required />
      <br/><br/>
      <button type="submit">Enviar nova senha</button>
    </form>

    <div id="msg"></div>

    <script>
      // Exemplo: evitar mostrar se o e-mail existe (UX + segurança)
      const form = document.getElementById('recuperar-form');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        // faz chamada fetch para backend; aqui simulamos resposta
        msg.textContent = "Se existe uma conta vinculada a esse e-mail, enviamos instruções.";
      });
    </script>
  </main>
</body>
</html>
